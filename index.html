<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#477ee8">
  <meta name="description" content="Tam — Video Editor & Game Creative portfolio.">
  <title>Tam Tam | Video Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900;1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/game-ui.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <svg class="svg-library" aria-hidden="true">
    <symbol id="icon-game" viewBox="0 0 24 24"><path d="M7 6h10c3 0 4 3 5 10 .4 3-2 4-4 2l-3-3H9l-3 3c-2 2-4.4 1-4-2C3 9 4 6 7 6Z" fill="currentColor"/><path d="M7 9v5m-2.5-2.5h5" fill="none" stroke="#4776e3" stroke-width="1.8"/><circle cx="16" cy="10" r="1" fill="#4776e3"/><circle cx="19" cy="13" r="1" fill="#4776e3"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5Z" fill="currentColor"/></symbol>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4Z" fill="currentColor"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c.6-5 3-7 8-7s7.4 2 8 7" fill="currentColor"/></symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24"><path d="M3 5h18v14H3Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m4 7 8 7 8-7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </svg>

  <div class="game-world">
    <div class="cloud cloud-one"></div><div class="cloud cloud-two"></div>
    <header class="topbar wrap">
      <button class="brand game-press" data-route="home" aria-label="Open home">
        <span class="brand-icon"><svg><use href="#icon-game"/></svg></span>
        <span>Tam</span><b>✦</b>
      </button>
      <nav class="game-tabs" aria-label="Portfolio pages">
        <button class="game-tab is-active" data-route="home"><svg><use href="#icon-home"/></svg><span>Home</span></button>
        <button class="game-tab" data-route="projects"><svg><use href="#icon-game"/></svg><span>Projects</span></button>
        <button class="game-tab" data-route="about"><svg><use href="#icon-user"/></svg><span>About</span></button>
        <button class="game-tab" data-route="contact"><svg><use href="#icon-mail"/></svg><span>Contact</span></button>
      </nav>
      <button class="game-button yellow compact game-press" data-route="projects">View work <svg><use href="#icon-arrow"/></svg></button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>
    <footer class="wrap"><span>© <span id="year"></span> Tam · Made with a playful mind.</span><button data-route="home">Back home ↑</button></footer>
  </div>

  <dialog id="game-popup" class="game-popup">
    <div class="popup-frame">
      <div class="popup-titlebar"><span id="popup-label">PROJECT DETAILS</span><button class="popup-close game-press" aria-label="Close popup">×</button></div>
      <div id="popup-content" class="popup-content"></div>
    </div>
  </dialog>

  <div id="loading" class="loading-screen" aria-label="Loading"><div class="loading-logo"><svg><use href="#icon-game"/></svg></div><div class="loading-bar"><i></i></div></div>
  <script src="data/projects.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
